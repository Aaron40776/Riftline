name: Patch + build itch zip
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch src/index.html (viewport, iOS metas, dark bg, full-bleed canvas)
        run: |
          # 1) viewport meta with viewport-fit=cover (normalizes any existing tag)
          perl -pi -e 's{<meta[^>]*name=.viewport[^>]*>}{<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">}' src/index.html
          if ! grep -qE 'name=.viewport' src/index.html; then
            perl -pi -e 's{(<head[^>]*>)}{$1\n  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">}' src/index.html
          fi

          # 2) iOS standalone metas (only if missing)
          if ! grep -q 'apple-mobile-web-app-capable' src/index.html; then
            perl -pi -e 's{(<head[^>]*>)}{$1
              <meta name="mobile-web-app-capable" content="yes">
              <meta name="apple-mobile-web-app-capable" content="yes">
              <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
              <meta name="apple-mobile-web-app-title" content="Riftline">}' src/index.html
          fi

          # 3) display fix: dark page + canvas forced full-bleed on every device
          if grep -q 'RIFTLINE-PWA-FIX' src/index.html; then
            perl -pi -e 's{<style id="RIFTLINE-PWA-FIX">.*?</style>}{<style id="RIFTLINE-PWA-FIX">html,body{margin:0!important;padding:0!important;height:100%!important;background:#05070d!important;overflow:hidden!important}*{-webkit-text-size-adjust:100%!important;text-size-adjust:100%!important}#gl{position:fixed!important;left:0!important;top:0!important;width:100vw!important;height:100vh!important;height:100dvh!important;max-width:none!important;max-height:none!important;aspect-ratio:auto!important;margin:0!important;transform:none!important;border:0!important;outline:none!important}}</style>}' src/index.html
          else
            perl -pi -e 's{</head>}{<style id="RIFTLINE-PWA-FIX">html,body{margin:0!important;padding:0!important;height:100%!important;background:#05070d!important;overflow:hidden!important}*{-webkit-text-size-adjust:100%!important;text-size-adjust:100%!important}#gl{position:fixed!important;left:0!important;top:0!important;width:100vw!important;height:100vh!important;height:100dvh!important;max-width:none!important;max-height:none!important;aspect-ratio:auto!important;margin:0!important;transform:none!important;border:0!important;outline:none!important}}</style></head>}' src/index.html
          fi

          # 4) resize fix: re-measure after launch/orientation changes (fixes iOS PWA launch race)
          if grep -q 'RIFTLINE-RESIZE-FIX' src/index.html; then
            perl -pi -e 's{<script id="RIFTLINE-RESIZE-FIX">.*?</script>}{<script id="RIFTLINE-RESIZE-FIX">(function(){function f(){try{window.dispatchEvent(new Event("resize"))}catch(e){}}var vv=window.visualViewport;if(vv){vv.addEventListener("resize",f)}window.addEventListener("orientationchange",function(){setTimeout(f,150);setTimeout(f,700)});[50,250,700,1500].forEach(function(t){setTimeout(f,t)})})();</script>}' src/index.html
          else
            perl -pi -e 's{</head>}{<script id="RIFTLINE-RESIZE-FIX">(function(){function f(){try{window.dispatchEvent(new Event("resize"))}catch(e){}}var vv=window.visualViewport;if(vv){vv.addEventListener("resize",f)}window.addEventListener("orientationchange",function(){setTimeout(f,150);setTimeout(f,700)});[50,250,700,1500].forEach(function(t){setTimeout(f,t)})})();</script></head>}' src/index.html
          fi

      - name: Patch manifest (display fullscreen)
        run: |
          if grep -q '"display": "standalone"' public/manifest.webmanifest && ! grep -q 'display_override' public/manifest.webmanifest; then
            perl -pi -e 's{"display": "standalone",}{"display": "fullscreen",\n  "display_override": ["fullscreen", "standalone"],}' public/manifest.webmanifest
          fi

      - name: Commit patched sources back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/index.html public/manifest.webmanifest
          if git diff --cached --quiet; then
            echo "Already patched — nothing to commit"
          else
            git commit -m "Display fix: full-bleed canvas on all devices + resize handling"
            git push
          fi

      - name: Trigger Pages deploy (skips silently if workflow not manually runnable)
        continue-on-error: true
        run: gh workflow run "Deploy to GitHub Pages" --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm run build

      - name: Package itch zip (from patched sources)
        run: cd dist && zip -r ../riftline-itch.zip .

      - name: Verify patches in build output
        run: |
          grep -c 'RIFTLINE-PWA-FIX' dist/index.html
          grep -c 'RIFTLINE-RESIZE-FIX' dist/index.html
          grep -o 'viewport-fit=cover' dist/index.html
          sed -n '1,30p' dist/index.html

      - uses: actions/upload-artifact@v4
        with:
          name: riftline-itch
          path: riftline-itch.zip
