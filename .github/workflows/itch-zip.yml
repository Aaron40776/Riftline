name: Patch + build itch zip
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch sources (python — quoting-proof)
        run: |
          python3 - <<'PYEOF'
          import re, io

          # ---- src/index.html ----
          path = "src/index.html"
          s = io.open(path, encoding="utf-8").read()
          orig = s

          VIEWPORT = '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">'

          METAS = (
            '<meta name="mobile-web-app-capable" content="yes">' "\n"
            '    <meta name="apple-mobile-web-app-capable" content="yes">' "\n"
            '    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">' "\n"
            '    <meta name="apple-mobile-web-app-title" content="Riftline">'
          )

          STYLE = (
            '<style id="RIFTLINE-PWA-FIX">'
            'html,body{margin:0!important;padding:0!important;height:100%!important;background:#05070d!important;overflow:hidden!important}'
            '*{-webkit-text-size-adjust:100%!important;text-size-adjust:100%!important}'
            '#gl{position:fixed!important;left:0!important;top:0!important;width:100vw!important;height:100vh!important;height:100dvh!important;max-width:none!important;max-height:none!important;aspect-ratio:auto!important;margin:0!important;transform:none!important;border:0!important;outline:none!important}'
            '</style>'
          )

          SCRIPT = (
            '<script id="RIFTLINE-RESIZE-FIX">(function(){function f(){try{window.dispatchEvent(new Event("resize"))}catch(e){}}'
            'var vv=window.visualViewport;if(vv){vv.addEventListener("resize",f)}'
            'window.addEventListener("orientationchange",function(){setTimeout(f,150);setTimeout(f,700)});'
            '[50,250,700,1500].forEach(function(t){setTimeout(f,t)})})();</script>'
          )

          # 1) viewport meta: replace existing, or insert after <head>
          if re.search(r"<meta[^>]*viewport", s, re.I):
              s = re.sub(r"<meta[^>]*viewport[^>]*>", VIEWPORT, s, count=1, flags=re.I)
          else:
              m = re.search(r"<head[^>]*>", s, re.I)
              s = (s[:m.end()] + "\n  " + VIEWPORT) + s[m.end():] if m else (VIEWPORT + "\n" + s)

          # 2) iOS standalone metas
          if "apple-mobile-web-app-capable" not in s:
              m = re.search(r"<head[^>]*>", s, re.I)
              if m:
                  s = s[:m.end()] + "\n  " + METAS + s[m.end():]

          # 3) display fix style (replace if present, else insert before </head>)
          if 'id="RIFTLINE-PWA-FIX"' in s:
              s = re.sub(r'<style id="RIFTLINE-PWA-FIX">.*?</style>', STYLE.replace("\\", "\\\\"), s, count=1, flags=re.S)
          elif "</head>" in s:
              s = s.replace("</head>", STYLE + "\n</head>", 1)
          else:
              s = s + STYLE

          # 4) resize-fix script (replace if present, else insert before </head>)
          if 'id="RIFTLINE-RESIZE-FIX"' in s:
              s = re.sub(r'<script id="RIFTLINE-RESIZE-FIX">.*?</script>', SCRIPT.replace("\\", "\\\\"), s, count=1, flags=re.S)
          elif "</head>" in s:
              s = s.replace("</head>", SCRIPT + "\n</head>", 1)
          else:
              s = s + SCRIPT

          io.open(path, "w", encoding="utf-8").write(s)
          print("viewport:", "viewport-fit=cover" in s)
          print("ios metas:", "apple-mobile-web-app-capable" in s)
          print("style fix:", 'id="RIFTLINE-PWA-FIX"' in s)
          print("resize fix:", 'id="RIFTLINE-RESIZE-FIX"' in s)
          print("index.html changed:", s != orig)

          # ---- manifest ----
          mpath = "public/manifest.webmanifest"
          m = io.open(mpath, encoding="utf-8").read()
          if '"display": "standalone"' in m and "display_override" not in m:
              m = m.replace(
                  '"display": "standalone",',
                  '"display": "fullscreen",' + "\n" + '  "display_override": ["fullscreen", "standalone"],',
                  1,
              )
              io.open(mpath, "w", encoding="utf-8").write(m)
              print("manifest: patched")
          else:
              print("manifest: already OK")
          PYEOF

      - name: Commit patched sources back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/index.html public/manifest.webmanifest
          if git diff --cached --quiet; then
            echo "Already patched — nothing to commit"
          else
            git commit -m "Display fix: full-bleed canvas on all devices + resize handling"
            git push
          fi

      - name: Trigger Pages deploy (skips silently if not manually runnable)
        continue-on-error: true
        run: gh workflow run "Deploy to GitHub Pages" --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm run build

      - name: Package itch zip (from patched sources)
        run: cd dist && zip -r ../riftline-itch.zip .

      - name: Verify patches made it into the build
        run: |
          python3 - <<'PYEOF'
          s = open("dist/index.html", encoding="utf-8").read()
          checks = ("viewport-fit=cover", "RIFTLINE-PWA-FIX", "RIFTLINE-RESIZE-FIX", "black-translucent")
          for c in checks:
              print(("OK  " if c in s else "MISSING!") + " " + c)
          assert "viewport-fit=cover" in s and "RIFTLINE-PWA-FIX" in s, "patch missing from build!"
          m = open("dist/manifest.webmanifest", encoding="utf-8").read()
          print("manifest display:", "fullscreen" in m)
          PYEOF
          sed -n '1,30p' dist/index.html

      - uses: actions/upload-artifact@v7
        with:
          name: riftline-itch
          path: riftline-itch.zip
