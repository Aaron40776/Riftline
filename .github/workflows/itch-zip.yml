name: Build itch.io zip
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm run build
      - name: Package itch zip
        run: cd dist && zip -r ../riftline-itch.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: riftline-itch
          path: riftline-itch.zip
