# Runs the tests on pull requests, so a change is checked before it is merged. main itself is tested by
# pages.yml right before it deploys; the long checks run every night (nightly.yml).
# 3.32.0: no longer also on push: a push to a branch with a pull request ran the same tests twice (the two runs had
# different concurrency groups). A branch without a pull request can still be tested by hand (workflow_dispatch).
name: Test

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      # The tests drive the real game in headless Chromium, so the browser is installed here.
      - name: Install
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Formatting
        run: npm run format:check
      - name: Build and test
        run: npm test
      # 3.32.0: npm test only boots the menu; this plays a wave on a PC (about 40 s), so a crash while a wave is drawn
      # shows up before the merge
      - name: Play a wave
        run: node tools/qa.js full-qa run-desktop
